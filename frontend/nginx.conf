server {
    listen 80;

    # ── Static files (React SPA) ──────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # All non-proxied routes fall back to index.html so React Router handles
    # client-side navigation without returning a 404 from Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy — /ask ──────────────────────────────────────────────────────
    # Forward POST /ask to the FastAPI backend service named "backend" in the
    # Docker Compose network.  The relative URL "/ask" in the browser request
    # is rewritten to "http://backend:8000/ask" transparently.
    location /ask {
        proxy_pass         http://backend:8000/ask;
        proxy_set_header   Host        $host;
        proxy_set_header   X-Real-IP   $remote_addr;

        # Increase read timeout for long-running LLM calls (default is 60s).
        proxy_read_timeout 120s;
    }

    # ── API proxy — /health ───────────────────────────────────────────────────
    location /health {
        proxy_pass         http://backend:8000/health;
        proxy_set_header   Host        $host;
        proxy_set_header   X-Real-IP   $remote_addr;
    }
}
